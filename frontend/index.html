<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexoFoco · Seu ritmo, em boa companhia</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
  <main class="access-page" id="conteudo" tabindex="-1">
    <section class="access-story">
      <a class="brand" href="index.html"><span class="brand-symbol"><svg viewBox="0 0 36 36" fill="none" aria-hidden="true"><path d="M8 26V10h5l10 16V10h5v16h-5L13 10v16" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/><circle cx="29" cy="6" r="2.5" fill="#eda77e"/></svg></span><span>Nexo<span class="brand-focus">Foco</span><span class="brand-dot">.</span></span></a>
      <div class="access-story-content">
        <h1>Estude junto.<br>Cresça no<br><em>mesmo ritmo.</em></h1>
        <div class="access-art">
          <img class="focus-art" src="assets/focus-art.svg" alt="">
          <div class="floating-study"><span class="dot green"></span>Foco compartilhado<span class="floating-time">25:00</span></div>
        </div>
      </div>
    </section>

    <section class="access-form">
      <div class="access-form-inner">
              <div class="auth-tabs">
          <button type="button" id="aba-entrar" class="selected">Entrar</button>
          <button type="button" id="aba-criar">Criar conta</button>
        </div>

        <!-- Se os campos estiverem certos, o formulário é enviado e o navegador abre o dashboard.html -->
        <form id="form-acesso" action="dashboard.html" method="post" novalidate>
          <label class="field escondido" id="campo-nome">Nome completo
            <input id="nome" name="nome" placeholder="Seu nome">
            <span id="erro-nome" class="field-error"></span>
          </label>
          <label class="field">E-mail
            <div class="input-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/></svg><input id="email" name="email" type="email" placeholder="voce@universidade.br"></div>
            <span id="erro-email" class="field-error"></span>
          </label>
          <label class="field">Senha
            <div class="input-icon"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg><input id="senha" name="senha" type="password" placeholder="Pelo menos 8 caracteres"><button type="button" class="icon-btn" id="mostrar-senha" aria-label="Mostrar senha"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
            <span id="erro-senha" class="field-error"></span>
          </label>
          <label class="remember" id="lembrar"><input name="lembrar" type="checkbox">Manter conectado</label>
          <button class="btn btn-primary full" type="submit"><span id="texto-botao">Entrar</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></button>
        </form>

        <div class="auth-divider"><span>ou</span></div>
        <a class="btn btn-outline full" href="dashboard.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></svg>Explorar demonstração</a>
      </div>
    </section>
  </main>

  <script src="js/acesso.js"></script>
</body>
</html>
